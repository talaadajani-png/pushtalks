[package]
name = "pushtalks"
version = "0.1.1"
edition = "2021"
description = "PushTalks: local-first dictation and meeting transcription for PUSH Media"
publish = false
default-run = "pushtalks"
license = "UNLICENSED"

[lib]
name = "pushtalks_lib"
path = "src/lib.rs"

[[bin]]
name = "pushtalks"
path = "src/main.rs"

[[bin]]
name = "pushtalks-mcp"
path = "src/bin/pushtalks-mcp.rs"

[[bin]]
name = "pushtalks-cli"
path = "src/bin/pushtalks-cli.rs"

# PRD §7.5 puts the benchmark harness under scripts/.
[[bin]]
name = "benchmark"
path = "../scripts/benchmark.rs"

[dependencies]
# Official k2-fsa bindings; links the prebuilt static sherpa-onnx + onnxruntime libraries.
sherpa-onnx = "=1.13.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bzip2 = "0.5"
tar = "0.4"
# The only HTTP client in the project; used solely by src/models/download.rs.
ureq = "3"
dirs = "6"
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
cpal = "0.18.2"
arboard = "3.7.0"
enigo = "0.6.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
crossbeam-channel = "0.5.17"
parking_lot = "0.13.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Power",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Calendar lookup for meeting titles (EventKit), local only.
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = ["NSDate", "NSArray", "NSString", "NSError", "NSPredicate", "NSProcessInfo", "NSObject"] }
objc2-event-kit = { version = "=0.3.2", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKObject", "EKTypes", "EKCalendar", "block2"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
screencapturekit = "11.0.0"

[profile.release]
lto = "thin"
codegen-units = 4

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# Hashing models in debug builds is otherwise very slow.
[profile.dev.package.sha2]
opt-level = 3
